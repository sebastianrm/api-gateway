components:
  schemas:
    GatewayHealthResponse:
      type: object
      description: Respuesta de health check del API Gateway
      properties:
        status:
          type: string
          description: Estado del gateway
          enum: [UP, DOWN]
          example: "UP"
        service:
          type: string
          description: Nombre del servicio
          example: "api-gateway"
        timestamp:
          type: string
          format: date-time
          description: Timestamp del health check (ISO 8601)
          example: "2024-01-15T10:30:00Z"

    ApiError:
      type: object
      description: Cuerpo estándar de error de la API Yanki
      properties:
        timestamp:
          type: string
          format: date-time
          description: Momento exacto en que se generó el error (ISO 8601)
          example: "2024-01-15T10:30:00Z"
        status:
          type: integer
          format: int32
          description: Código de estado HTTP
          example: 503
        error:
          type: string
          description: Descripción textual del error HTTP
          example: "Service Unavailable"
        code:
          type: string
          description: Código de negocio específico del error
          example: "SERVICE_UNAVAILABLE"
        message:
          type: string
          description: Descripción legible del error en español
          example: "El servicio destino no está disponible en este momento, intételo nuevamente"
        path:
          type: string
          description: Ruta de la API que originó el error
          example: "/api/accounts"
        details:
          type: object
          description: Detalle adicional del error
          additionalProperties: true
          nullable: true

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido mediante el endpoint /api/auth/login del auth-service

security:
  - BearerAuth: []
