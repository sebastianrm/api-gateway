openapi: 3.0.3
info:
  title: Yanki API Gateway
  description: |
    API Gateway de la plataforma bancaria Yanki.
    
    Puerta de entrada única para todos los microservicios. Maneja enrutamiento,
    validación JWT, circuit breaker, CORS y respuestas de fallback.
    
    **Características principales:**
    - Enrutamiento a microservicios backend
    - Validación de tokens JWT
    - Circuit breaker con fallback responses
    - CORS configuration
    - Rate limiting
    - Health check del gateway
  version: 1.0.0
  contact:
    name: Sebastian Retamal Morales
    email: retamal.sebastian@gmail.com
  license:
    name: Proprietary
    url: https://yanki.com/license

servers:
  - url: http://localhost:8080
    description: Entorno local de desarrollo
  - url: https://api-gateway.yanki.com
    description: Entorno de producción

tags:
  - name: Fallback
    description: Respuesta de respaldo de la API Gateway
  - name: Gateway
    description: Endpoints del API Gateway

paths:
  /fallback/health:
    get:
      tags: [Gateway]
      summary: Consulta el estado del gateway
      description: Retorna el estado básico de la API Gateway. Endpoint público sin autenticación.
      operationId: gatewayHealth
      responses:
        '200':
          description: Estado del gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayHealthResponse'
              example:
                status: "UP"
                service: "api-gateway"
                timestamp: "2024-01-15T10:30:00Z"
      security: []

  /fallback/**:
    get:
      tags: [Fallback]
      summary: Responde 503 cuando el microservicio destino no está disponible
      description: |
        Endpoint de respaldo (fallback) activado por el circuit breaker cuando un microservicio
        backend no está disponible. Responde 503 con el cuerpo JSON estándar ApiError.
        
        **Nota:** Este endpoint es público y no requiere token JWT.
      operationId: fallback
      responses:
        '503':
          description: El servicio destino no está disponible en este momento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2024-01-15T10:30:00Z"
                status: 503
                error: "Service Unavailable"
                code: "SERVICE_UNAVAILABLE"
                message: "El servicio destino no está disponible en este momento, intételo nuevamente"
                path: "/api/accounts"
                details: null
      security: []

  /api/auth/**:
    get:
      tags: [Gateway]
      summary: Rutas de autenticación (proxy a auth-service)
      description: |
        Todas las rutas /api/auth/* se enrutan al auth-service (puerto 8081).
        Los endpoints de login y refresh son públicos; validate y logout requieren JWT.
      operationId: authProxy
      responses:
        '200':
          description: Solicitud enrutada exitosamente al auth-service
        '401':
          description: Token JWT inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: auth-service no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/customers/**:
    get:
      tags: [Gateway]
      summary: Rutas de clientes (proxy a customers-service)
      description: Todas las rutas /api/customers/* se enrutan al customers-service (puerto 8082)
      operationId: customersProxy
      responses:
        '200':
          description: Solicitud enrutada exitosamente al customers-service
        '401':
          description: Token JWT inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: customers-service no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/accounts/**:
    get:
      tags: [Gateway]
      summary: Rutas de cuentas (proxy a accounts-service)
      description: Todas las rutas /api/accounts/* se enrutan al accounts-service (puerto 8083)
